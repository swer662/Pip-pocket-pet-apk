name: Build Pip-PocketPet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой "Run workflow"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Выгрузка исходного кода
        uses: actions/checkout@v4

      - name: 2. Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Сборка Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 5. Публикация готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pip-PocketPet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
